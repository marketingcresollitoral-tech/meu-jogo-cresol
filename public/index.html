<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Overworld Online - Cresol Litoral</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
    body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    
    #game-container { 
      position: relative; width: 1000px; height: 550px; margin-top: 10px; 
      border: 4px solid #fff; border-radius: 8px; outline: none;
    }
    canvas { background: #27ae60; display: block; }
    
    .chat-bubble {
      position: absolute; background: #ffffff; color: #000000; padding: 12px 16px;
      border-radius: 12px; border: 4px solid #f1c40f; font-size: 11px; font-weight: bold;
      max-width: 250px; text-align: center; user-select: none; cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6); z-index: 100;
      transform: translate(-50%, -100%); transition: transform 0.1s;
    }
    .chat-bubble:active { transform: translate(-50%, -98%) scale(0.97); }

    .press-key-tag {
      display: block; margin-top: 8px; font-size: 9px; color: #d35400;
      text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold;
      background: #ffeaa7; padding: 4px 8px; border-radius: 4px; border: 1px solid #d35400;
    }

    #login-screen {
      position: absolute; top: 0; left: 0; width: 1000px; height: 550px;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 200;
    }
    .btn-login { background: #f1c40f; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="game-container" tabindex="0">
    <div id="login-screen">
      <h2>ENTRAR NO OVERWORLD ONLINE</h2><br>
      <button class="btn-login" onclick="login('Andre (Jaguaruna)', '#e74c3c')">Andre (Jaguaruna)</button>
      <button class="btn-login" onclick="login('Lais (Sangão)', '#2ecc71')">Lais (Sangão)</button>
      <button class="btn-login" onclick="login('Juliano (Tubarão)', '#f1c40f')">Juliano (Tubarão)</button>
    </div>

    <canvas id="mapCanvas" width="1000" height="550"></canvas>
    <div id="chat-bubbles-container"></div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    let myId = null;
    let onlinePlayers = {};
    let myPos = { x: 200, y: 300 };
    const speed = 4;
    const keys = {};

    function login(name, color) {
      document.getElementById('login-screen').style.display = 'none';
      socket.emit('joinGame', { name: name, role: 'Gerente', color: color });
    }

    socket.on('connect', () => { myId = socket.id; });
    socket.on('updatePlayers', (players) => { onlinePlayers = players; });
    socket.on('playerMoved', (player) => { onlinePlayers[player.id] = player; });
    socket.on('playerDisconnected', (id) => { 
      delete onlinePlayers[id]; 
      removeBubble(id);
    });

    // Início de conversa
    socket.on('startConversation', (data) => {
      removeAllBubbles();
      const p = onlinePlayers[data.initialSpeakerId];
      if (p) {
        showBubble(p.id, p.x, p.y, data.initialSpeech, data.nextTurnName);
      }
    });

    // Atualização de turno do diálogo
    socket.on('updateConversationStep', (data) => {
      removeAllBubbles();
      const p = onlinePlayers[data.speakerId];
      if (p) {
        showBubble(p.id, p.x, p.y, data.speech, data.nextTurnName);
      }
    });

    socket.on('endConversation', (data) => {
      removeAllBubbles();
    });

    function advanceDialogue() {
      if (onlinePlayers[myId] && onlinePlayers[myId].inConversation) {
        socket.emit('nextDialogue');
      }
    }

    // Teclas do Teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'e' || e.key === 'E' || e.key === 'Enter' || e.code === 'KeyE' || e.code === 'Enter' || e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        advanceDialogue();
      }

      if (e.key === 'Escape' || e.code === 'Escape') {
        socket.emit('leaveConversation');
      }

      keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function update() {
      if (!myId || !onlinePlayers[myId] || onlinePlayers[myId].inConversation) return;

      let moved = false;
      if (keys.ArrowUp || keys.w || keys.W) { myPos.y -= speed; moved = true; }
      if (keys.ArrowDown || keys.s || keys.S) { myPos.y += speed; moved = true; }
      if (keys.ArrowLeft || keys.a || keys.A) { myPos.x -= speed; moved = true; }
      if (keys.ArrowRight || keys.d || keys.D) { myPos.x += speed; moved = true; }

      if (moved) {
        onlinePlayers[myId].x = myPos.x;
        onlinePlayers[myPos.y] = myPos.y;
        socket.emit('move', myPos);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let id in onlinePlayers) {
        const p = onlinePlayers[id];

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 20);

        const bubble = document.getElementById(`bubble-${id}`);
        if (bubble) {
          bubble.style.left = `${p.x}px`;
          bubble.style.top = `${p.y - 35}px`;
        }
      }
    }

    function showBubble(id, x, y, text, nextTurnName) {
      removeBubble(id);
      const bubblesContainer = document.getElementById('chat-bubbles-container');
      const bubble = document.createElement('div');
      bubble.id = `bubble-${id}`;
      bubble.className = 'chat-bubble';
      
      bubble.onclick = (e) => {
        e.stopPropagation();
        advanceDialogue();
      };

      bubble.innerHTML = `
        <div>${text}</div>
        <span class="press-key-tag">▶ Clique p/ responder ${nextTurnName}</span>
      `;
      
      bubble.style.left = `${x}px`;
      bubble.style.top = `${y - 35}px`;
      bubblesContainer.appendChild(bubble);
    }

    function removeBubble(id) {
      const bubble = document.getElementById(`bubble-${id}`);
      if (bubble) bubble.remove();
    }

    function removeAllBubbles() {
      const bubblesContainer = document.getElementById('chat-bubbles-container');
      bubblesContainer.innerHTML = '';
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
