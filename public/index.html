<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Overworld Online - Cresol Litoral</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
    body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    #game-container { position: relative; width: 1000px; height: 550px; margin-top: 20px; border: 4px solid #fff; border-radius: 8px; }
    canvas { background: #27ae60; display: block; }
    
    /* Balão de Fala do Diálogo IA */
    .chat-bubble {
      position: absolute; background: #fff; color: #000; padding: 8px 12px;
      border-radius: 12px; border: 2px solid #000; font-size: 11px; font-weight: bold;
      max-width: 180px; text-align: center; pointer-events: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4); z-index: 100;
      transform: translate(-50%, -100%);
    }

    #login-screen {
      position: absolute; top: 0; left: 0; width: 1000px; height: 550px;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 200;
    }
    .btn-login { background: #f1c40f; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="login-screen">
      <h2>ENTRAR NO OVERWORLD ONLINE</h2>
      <br>
      <button class="btn-login" onclick="login('Andre (Jaguaruna)', '#e74c3c')">Entrar como Andre</button>
      <button class="btn-login" onclick="login('Lais (Sangão)', '#2ecc71')">Entrar como Lais</button>
      <button class="btn-login" onclick="login('Juliano (Tubarão)', '#f1c40f')">Entrar como Juliano</button>
    </div>

    <canvas id="mapCanvas" width="1000" height="550"></canvas>
    <div id="chat-bubbles-container"></div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    let myId = null;
    let onlinePlayers = {};
    let myPos = { x: 200, y: 300 };
    const speed = 4;
    const keys = {};

    function login(name, color) {
      document.getElementById('login-screen').style.display = 'none';
      socket.emit('joinGame', { name: name, role: 'Gerente', color: color });
    }

    socket.on('connect', () => { myId = socket.id; });
    socket.on('updatePlayers', (players) => { onlinePlayers = players; });
    socket.on('playerMoved', (player) => { onlinePlayers[player.id] = player; });
    socket.on('playerDisconnected', (id) => { 
      delete onlinePlayers[id]; 
      removeBubble(id);
    });

    // Evento disparado quando 2 jogadores se esbarram
    socket.on('triggerConversation', (data) => {
      const p1 = onlinePlayers[data.p1Id];
      const p2 = onlinePlayers[data.p2Id];

      if (p1 && data.dialog[p1.name]) showBubble(p1.id, p1.x, p1.y, data.dialog[p1.name]);
      if (p2 && data.dialog[p2.name]) showBubble(p2.id, p2.x, p2.y, data.dialog[p2.name]);
    });

    socket.on('endConversation', (data) => {
      removeBubble(data.p1Id);
      removeBubble(data.p2Id);
    });

    // Teclas
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function update() {
      if (!myId || !onlinePlayers[myId] || onlinePlayers[myId].inConversation) return;

      let moved = false;
      if (keys.ArrowUp || keys.w) { myPos.y -= speed; moved = true; }
      if (keys.ArrowDown || keys.s) { myPos.y += speed; moved = true; }
      if (keys.ArrowLeft || keys.a) { myPos.x -= speed; moved = true; }
      if (keys.ArrowRight || keys.d) { myPos.x += speed; moved = true; }

      if (moved) {
        onlinePlayers[myId].x = myPos.x;
        onlinePlayers[myId].y = myPos.y;
        socket.emit('move', myPos);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenhar todos os jogadores ONLINE
      for (let id in onlinePlayers) {
        const p = onlinePlayers[id];

        // Avatar
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nome em cima do boneco
        ctx.fillStyle = '#fff';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 20);

        // Atualizar posição do balão de fala se existir
        const bubble = document.getElementById(`bubble-${id}`);
        if (bubble) {
          bubble.style.left = `${p.x}px`;
          bubble.style.top = `${p.y - 35}px`;
        }
      }
    }

    function showBubble(id, x, y, text) {
      removeBubble(id);
      const container = document.getElementById('chat-bubbles-container');
      const bubble = document.createElement('div');
      bubble.id = `bubble-${id}`;
      bubble.className = 'chat-bubble';
      bubble.innerText = text;
      bubble.style.left = `${x}px`;
      bubble.style.top = `${y - 35}px`;
      container.appendChild(bubble);
    }

    function removeBubble(id) {
      const bubble = document.getElementById(`bubble-${id}`);
      if (bubble) bubble.remove();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
